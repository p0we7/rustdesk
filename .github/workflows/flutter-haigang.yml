name: Flutter HaiGang Build

on:
  workflow_dispatch:
  push:
    branches:
      - 1.4.5-haigang
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"


jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build-windows.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "haigang"
